name: Release docs version

# Publishes a frozen copy of the docs for one mzmine release, e.g.
#   https://mzmine.github.io/mzmine_documentation/4.8.0/
# It never touches "latest" (which always tracks master) or the site root.
#
# Two ways to trigger it:
#   * push a tag "v<version>" in this repository, e.g. v4.8.0
#   * run it manually and pick the branch/tag to snapshot plus the version name

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'mzmine version these docs belong to, e.g. 4.8.0'
        required: true
        type: string

# never let two jobs write to gh-pages at the same time
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # full history for the git-revision-date/git-authors plugins and for gh-pages
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN || github.token }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${TAG_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*([-.][A-Za-z0-9]+)*$'; then
            echo "::error::'$VERSION' is not a valid version, expected something like 4.8.0"
            exit 1
          fi
          if [ "$VERSION" = "latest" ]; then
            echo "::error::'latest' is reserved for the master build"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "publishing docs version $VERSION"
      - name: Test Build
        run: |
          mkdocs build -s
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy version
        run: |
          mike deploy --push "$VERSION"
      - name: Publish static gh-pages root files
        run: bash .github/scripts/publish-pages-root.sh
      - name: Summary
        run: |
          echo "Published [\`$VERSION\`](https://mzmine.github.io/mzmine_documentation/$VERSION/)" >> "$GITHUB_STEP_SUMMARY"
